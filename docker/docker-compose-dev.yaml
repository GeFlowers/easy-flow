# DeerFlow Docker Compose 项目配置。
# 唯一支持的启动入口是在仓库根目录执行 `make docker-start`。
#
# 服务说明：
#   - nginx：反向代理，端口 2026。
#   - frontend：前端 Next.js 服务，端口 3000。
#   - gateway：后端网关接口及智能体运行时，端口 8001。
#   - postgres：保存运行记录、检查点和通用存储数据。
#   - Redis Streams bridge：使用 ../.env 中配置的主机 Redis 服务。
#
# 访问地址：http://localhost:2026

services:
  # ── PostgreSQL 数据持久化 ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: deer-flow-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-deerflow}
      - POSTGRES_USER=${POSTGRES_USER:-deerflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deerflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # ── 反向代理 ────────────────────────────────────────────────────────────
  # 将接口流量转发到网关，将页面请求转发到前端。
  nginx:
    build:
      context: ./
      dockerfile: nginx.Dockerfile
    image: deer-flow-nginx:local
    container_name: deer-flow-nginx
    ports:
      - "2026:2026"
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026[[:space:]]/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # 前端：由镜像提供服务，不挂载主机源码，也不启用热重载。
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    working_dir: /app
    environment:
      - NODE_ENV=production
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # 后端：由镜像提供网关接口，不挂载主机源码，也不启用热重载。
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: deer-flow-gateway
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/project/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/project/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}
      # HTTP_PROXY、HTTPS_PROXY 和 ALL_PROXY 通过 env_file 从 ../.env 继承。
      # 此处单独声明 NO_PROXY，确保内部服务主机名始终绕过代理。
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,postgres,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,postgres,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      # Linux 环境下将 host.docker.internal 映射到主机网关。
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deer-flow-dev
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  deer-flow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
