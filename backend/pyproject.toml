[project]
name = "deer-flow"
version = "2.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.31",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "wecom-aibot-python-sdk>=0.1.6",
    "bcrypt>=4.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.0.0",
    "e2b-code-interpreter>=2.8.1",
]

[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
redis = ["deerflow-harness[redis]"]
monocle = ["deerflow-harness[monocle]"]

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.0",
    "ruff>=0.14.11",
    # Monocle 追踪器也属于 deerflow-harness[monocle] 可选依赖；放在开发依赖组中，
    # 供追踪测试导入，同时避免普通安装被强制带入。
    "monocle_apptrace>=0.8.8",
    # Redis 是可选运行依赖（deerflow-harness[redis]）；在开发依赖组中固定版本，
    # 确保流桥接测试可以导入并验证 Redis 桥接，而生产安装无需强制携带。
    "redis>=5.0.0",
    # 终端界面的运行依赖也属于 deerflow-harness[tui] 可选依赖；放在开发依赖组中，
    # 供本地或持续集成环境运行和测试终端工作台。
    "textual>=0.80",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
