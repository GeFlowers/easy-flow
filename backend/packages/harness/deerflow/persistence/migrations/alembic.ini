[alembic]
script_location = %(here)s
# 离线模式或自动生成迁移时使用的默认数据库地址。
# 程序运行时使用 DeerFlow 配置创建的数据库引擎。
sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/deerflow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
