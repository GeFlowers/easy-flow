[project]
name = "deerflow-harness"
version = "2.1.0"
description = "DeerFlow agent harness framework"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.4.0",
    "croniter>=6.0.0",
    "dotenv>=0.9.9",
    "exa-py>=1.0.0",
    "httpx>=0.28.0",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=3.4.1",
    "langgraph>=1.1.9",
    "langgraph-api>=0.8.1",
    "langgraph-cli>=0.4.24",
    "langgraph-runtime-inmem>=0.28.0",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.0.1a2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "tavily-python>=0.7.17",
    "firecrawl-py>=1.15.0",
    "tiktoken>=0.8.0",
    "ddgs>=9.10.0",
    "duckdb>=1.4.4",
    "langchain-google-genai>=4.2.1",
    "langgraph-sdk>=0.1.51",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13",
    "cryptography>=48.0.1",
    "e2b-code-interpreter>=2.8.0",
]

[project.scripts]
deerflow = "deerflow.tui.cli:main"

[project.optional-dependencies]
# 终端工作台依赖保持可选，以精简核心运行环境；未安装 textual 时，
# `deerflow` 命令行程序会退化为不依赖终端界面的帮助输出。
tui = ["textual>=0.80"]
# GroundRoute 无需额外安装依赖（httpx 已是核心依赖）。保留空的可选依赖组，
# 使 `uv add 'deerflow-harness[groundroute]'` 安装命令不会报告未知依赖组。
groundroute = []
ollama = ["langchain-ollama>=0.3.0"]
postgres = [
    "asyncpg>=0.29",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
# 跨进程事件流桥接（由 stream_bridge 配置段控制）。该依赖组保持可选，
# 网关检测到桥接配置后再安装对应组件。
redis = ["redis>=5.0.0"]
pymupdf = ["pymupdf4llm>=0.0.17"]
boxlite = ["boxlite>=0.9.7"]
# 智能体可观测性组件（Monocle）保持可选，默认安装不包含 OpenTelemetry 依赖；
# 仅在启用 MONOCLE_TRACING 时使用。
monocle = ["monocle_apptrace>=0.8.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow"]
