# 学习版示例：复制为 config.yaml；模型凭据从 .env 读取。
config_version: 26
log_level: info

# 替换模型名称和服务地址，使用兼容 OpenAI 的服务。
models:
  - name: gpt-5.4
    display_name: GPT-5.4
    use: langchain_openai:ChatOpenAI
    model: gpt-5.4
    base_url: https://api.openai.com/v1
    api_key: $OPENAI_API_KEY
    supports_vision: true
    supports_thinking: false
    supports_reasoning_effort: true

# 候选工具还会受代理工具组、技能白名单和运行模式限制。
tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200
  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# 沙箱在后端容器中执行；默认禁止命令执行，可按需打开。
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

uploads:
  auto_convert_documents: true
  pdf_converter: auto

skills:
  container_path: /mnt/skills
  deferred_discovery: false

# 长期记忆保存到后端数据目录，不等于数据库中的对话检查点。
memory:
  enabled: true
  injection_enabled: true
  manager_class: deermem
  mode: middleware
  backend_config:
    max_facts: 100
    fact_confidence_threshold: 0.7
    max_injection_tokens: 2000

# 应用数据和检查点使用 PostgreSQL，事件流由宿主机 Redis 转发。
database:
  backend: postgres
  postgres_url: $DATABASE_URL
run_events:
  backend: db

# 非必要功能默认关闭，其余字段及默认值见后端配置目录。
tool_search:
  enabled: false
skill_evolution:
  enabled: false
scheduler:
  enabled: false
